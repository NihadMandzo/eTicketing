<div class="auth-page">
  <section class="page-header">
    <div class="container">
      <h1>Zaboravljena lozinka</h1>
      <p class="page-subtitle">Unesite email adresu i poslat ćemo vam link za resetovanje lozinke</p>
    </div>
  </section>

  <section class="content-section">
    <div class="container">
      <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (errorMessage()) {
          <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
        }
        @if (successMessage()) {
          <div class="alert alert-success">{{ successMessage() }}</div>
        }

        <label class="field">
          <span class="field-label">Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            class="field-input"
            [class.field-input-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <span class="field-error">Unesite ispravnu email adresu.</span>
          }
        </label>

        <button type="submit" class="btn btn-primary btn-lg submit-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Slanje u toku…' : 'Pošaljite link za resetovanje' }}
        </button>

        <p class="auth-switch">
          Sjetili ste se lozinke? <a routerLink="/prijava">Prijavite se</a>
        </p>
      </form>
    </div>
  </section>
</div>
