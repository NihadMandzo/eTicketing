<div class="auth-page">
  <section class="page-header">
    <div class="container">
      <h1>Resetovanje lozinke</h1>
      <p class="page-subtitle">Postavite novu lozinku za svoj eKarta nalog</p>
    </div>
  </section>

  <section class="content-section">
    <div class="container">
      @if (tokenMissing()) {
        <div class="auth-card">
          <div class="alert alert-error" role="alert">
            Link za resetovanje lozinke nije validan. Zatražite novi na stranici za prijavu.
          </div>
          <p class="auth-switch">
            <a routerLink="/zaboravljena-lozinka">Zatražite novi link</a>
          </p>
        </div>
      } @else {
        <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          @if (errorMessage()) {
            <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
          }

          <label class="field">
            <span class="field-label">Nova lozinka</span>
            <div class="password-input">
              <input
                [type]="hidePassword() ? 'password' : 'text'"
                formControlName="newPassword"
                autocomplete="new-password"
                class="field-input"
                [class.field-input-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="hidePassword() ? 'Prikaži lozinku' : 'Sakrij lozinku'"
              >
                {{ hidePassword() ? 'Prikaži' : 'Sakrij' }}
              </button>
            </div>
            @if (form.controls.newPassword.touched) {
              @if (form.controls.newPassword.hasError('required')) {
                <span class="field-error">Lozinka je obavezna.</span>
              } @else if (form.controls.newPassword.hasError('passwordStrength')) {
                <span class="field-error">Lozinka mora imati najmanje 8 karaktera i sadržavati veliko slovo, malo slovo, cifru i specijalni znak.</span>
              }
            }
          </label>

          <label class="field">
            <span class="field-label">Potvrdite novu lozinku</span>
            <input
              [type]="hidePassword() ? 'password' : 'text'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              class="field-input"
              [class.field-input-invalid]="form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched"
            />
            @if (form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched) {
              <span class="field-error">Lozinke se ne podudaraju.</span>
            }
          </label>

          <button type="submit" class="btn btn-primary btn-lg submit-btn" [disabled]="isLoading()">
            {{ isLoading() ? 'Spremanje u toku…' : 'Resetujte lozinku' }}
          </button>
        </form>
      }
    </div>
  </section>
</div>
