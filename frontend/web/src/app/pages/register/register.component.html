<div class="auth-page">
  <section class="page-header">
    <div class="container">
      <h1>Registracija</h1>
      <p class="page-subtitle">Kreirajte svoj eKarta nalog</p>
    </div>
  </section>

  <section class="content-section">
    <div class="container">
      <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (errorMessage()) {
          <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
        }

        <div class="field-row">
          <label class="field">
            <span class="field-label">Ime</span>
            <input type="text" formControlName="firstName" autocomplete="given-name" class="field-input"
              [class.field-input-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched" />
            @if (form.controls.firstName.invalid && form.controls.firstName.touched) {
              <span class="field-error">Ime mora imati 2–100 karaktera.</span>
            }
          </label>

          <label class="field">
            <span class="field-label">Prezime</span>
            <input type="text" formControlName="lastName" autocomplete="family-name" class="field-input"
              [class.field-input-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched" />
            @if (form.controls.lastName.invalid && form.controls.lastName.touched) {
              <span class="field-error">Prezime mora imati 2–100 karaktera.</span>
            }
          </label>
        </div>

        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" formControlName="email" autocomplete="email" class="field-input"
            [class.field-input-invalid]="form.controls.email.invalid && form.controls.email.touched" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <span class="field-error">Unesite ispravnu email adresu.</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Korisničko ime</span>
          <input type="text" formControlName="username" autocomplete="username" class="field-input"
            [class.field-input-invalid]="form.controls.username.invalid && form.controls.username.touched" />
          @if (form.controls.username.invalid && form.controls.username.touched) {
            <span class="field-error">Korisničko ime mora imati 3–50 karaktera.</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Broj telefona <span class="optional">(opciono)</span></span>
          <input type="tel" formControlName="phoneNumber" autocomplete="tel" class="field-input" />
        </label>

        <label class="field">
          <span class="field-label">Lozinka</span>
          <div class="password-input">
            <input [type]="hidePassword() ? 'password' : 'text'" formControlName="password"
              autocomplete="new-password" class="field-input"
              [class.field-input-invalid]="form.controls.password.invalid && form.controls.password.touched" />
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()"
              [attr.aria-label]="hidePassword() ? 'Prikaži lozinku' : 'Sakrij lozinku'">
              {{ hidePassword() ? 'Prikaži' : 'Sakrij' }}
            </button>
          </div>
          @if (form.controls.password.touched) {
            @if (form.controls.password.hasError('required')) {
              <span class="field-error">Lozinka je obavezna.</span>
            } @else if (form.controls.password.hasError('passwordStrength')) {
              <span class="field-error">Lozinka mora imati najmanje 8 karaktera i sadržavati veliko slovo, malo slovo, cifru i specijalni znak.</span>
            }
          }
        </label>

        <label class="field">
          <span class="field-label">Potvrdite lozinku</span>
          <input [type]="hidePassword() ? 'password' : 'text'" formControlName="confirmPassword"
            autocomplete="new-password" class="field-input"
            [class.field-input-invalid]="form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched" />
          @if (form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched) {
            <span class="field-error">Lozinke se ne podudaraju.</span>
          }
        </label>

        <button type="submit" class="btn btn-primary btn-lg submit-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Registracija u toku…' : 'Registrujte se' }}
        </button>

        <p class="auth-switch">
          <!-- Carries returnUrl forward — see LoginComponent.returnUrlParams. -->
          Već imate nalog? <a routerLink="/prijava" [queryParams]="returnUrlParams()">Prijavite se</a>
        </p>
      </form>
    </div>
  </section>
</div>
