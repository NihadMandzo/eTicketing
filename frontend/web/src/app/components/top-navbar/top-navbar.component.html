<header class="top-navbar">
  <div class="navbar-container">
    <a routerLink="/" class="logo">
      <img src="/logo.png" alt="eKarta" class="logo-image" />
    </a>
    
    <div class="auth-buttons">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Uključi svijetli način rada' : 'Uključi tamni način rada'"
      >
        @if (theme() === 'dark') {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        }
      </button>
      @if (isAuthenticated()) {
        <a routerLink="/profil" class="btn btn-ghost user-link">{{ currentUser()?.firstName }}</a>
        <button type="button" class="btn btn-primary" (click)="logout()">Odjava</button>
      } @else {
        <a routerLink="/prijava" class="btn btn-ghost">Prijava</a>
        <a routerLink="/registracija" class="btn btn-primary">Registracija</a>
      }
    </div>
  </div>
</header>
