<div class="backdrop" role="presentation" (click)="cancel()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
    tabindex="-1"
    (click)="$event.stopPropagation()"
  >
    <h3 id="confirm-dialog-title">{{ title() }}</h3>
    <p id="confirm-dialog-message">{{ message() }}</p>

    <div class="actions">
      <button type="button" class="btn btn-outline" (click)="cancel()">{{ cancelLabel() }}</button>
      <button
        type="button"
        class="btn"
        [class.btn-primary]="!destructive()"
        [class.btn-destructive]="destructive()"
        (click)="confirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
