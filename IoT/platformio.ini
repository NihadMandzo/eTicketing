; eTicketing — ESP32-CAM gate scanner
;
; Board: AI-Thinker ESP32-CAM, flashed through an ESP32-CAM-MB (CH340) carrier.
; The MB pulls IO0 low for you while its RST button is held, so no jumper wire is needed —
; just `pio run -t upload`.
;
; The platform version is PINNED on purpose. ESP32QRCodeReader bundles quirc and drives the
; esp32-camera component directly; it is developed against arduino-esp32 2.x, and the 3.x core
; reworked both the camera driver's LEDC usage and the I2S/DMA paths it depends on. Pinning here
; is the difference between "builds and scans" and an afternoon of linker errors.

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The camera driver + WiFi + TLS-capable HTTP stack do not fit the default 1.2MB app partition.
board_build.partitions = huge_app.csv

; The AI-Thinker module carries 4MB of PSRAM. quirc's working buffers and the VGA frame buffer
; both live there; without this the decoder cannot allocate and every scan silently fails.
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    ; Bundles quirc and the esp32-camera glue for this exact board. If its API ever drifts,
    ; src/camera_qr.cpp is the only file that has to change.
    alvarowolfx/ESP32QRCodeReader @ ^0.1.2
    bblanchon/ArduinoJson @ ^7.2.0
    madhephaestus/ESP32Servo @ ^3.0.5
