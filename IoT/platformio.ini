; eTicketing — ESP32-CAM gate scanner
;
; Board: AI-Thinker ESP32-CAM, flashed through an ESP32-CAM-MB (CH340) carrier.
; The MB pulls IO0 low for you while its RST button is held, so no jumper wire is needed —
; just `pio run -t upload`.
;
; The platform version is PINNED on purpose. ESP32QRCodeReader bundles quirc and drives the
; esp32-camera component directly; it is developed against arduino-esp32 2.x, and the 3.x core
; reworked both the camera driver's LEDC usage and the I2S/DMA paths it depends on. Pinning here
; is the difference between "builds and scans" and an afternoon of linker errors.
;
; TWO BUILDS of the same firmware, chosen here and never in config.h, so a per-device settings file
; cannot turn a real gate into a development one:
;
;   pio run -e esp32cam -t upload        the real gate (also what a bare `pio run` builds)
;   pio run -e esp32cam-dev -t upload    local development
;
; | Build        | Server connection                                  | Diagnostic page        |
; |--------------|----------------------------------------------------|------------------------|
; | esp32cam     | HTTPS only, verified against GATE_API_ROOT_CA      | compiled out           |
; | esp32cam-dev | HTTPS as above, OR plain HTTP to a private LAN IP  | GATE_DEBUG_SERVER      |

[platformio]
default_envs = esp32cam

; Everything the two builds share.
[env]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Opening a serial monitor asserts DTR/RTS by default. On the ESP32-CAM-MB those lines are
; wired to IO0 and EN through the auto-reset circuit, so a monitor attaching can drop the chip
; into download mode (silent forever) instead of letting it run. Leaving both deasserted means
; attaching the monitor never touches the boot state -- press the MB's RST button to reboot.
monitor_dtr = 0
monitor_rts = 0

; The camera driver + WiFi + TLS-capable HTTP stack do not fit the default 1.2MB app partition.
board_build.partitions = huge_app.csv

; The AI-Thinker module carries 4MB of PSRAM. quirc's working buffers and the VGA frame buffer
; both live there; without this the decoder cannot allocate and every scan silently fails.
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    ; Bundles quirc and the esp32-camera glue for this exact board. If its API ever drifts,
    ; src/camera_qr.cpp is the only file that has to change.
    alvarowolfx/ESP32QRCodeReader @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.2.0
    madhephaestus/ESP32Servo @ ^3.0.5

; The real gate. HTTPS to a server whose certificate chains to the pinned root, and no diagnostic
; web page: an unauthenticated view of the camera has no place at a real entrance.
[env:esp32cam]

; Local development. Adds the diagnostic page, and allows plain HTTP to a private LAN address so a
; gate can be tried against `docker compose up` without certificates. Never flash this build onto a
; gate people walk through — it says so on the serial log at every boot.
[env:esp32cam-dev]
build_flags =
    ${env.build_flags}
    -DGATE_DEV_BUILD=1
