# =============================================================================
# eTicketing — unified stack
#
# One compose file, one .env (see .env.example) for backend + web + the
# one-shot mobile/desktop app builders.
#
#   Backend + web (long-running):
#     docker compose up -d --build
#
#   Mobile APK (one-shot, outputs to ./dist/mobile):
#     docker compose --profile build run --rm mobile-build
#
#   Desktop Linux bundle (one-shot, outputs to ./dist/desktop):
#     docker compose --profile build run --rm desktop-build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eticketing-sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
      ACCEPT_EULA: "Y"
    # Bound to loopback, not 0.0.0.0: this is a developer convenience (SSMS/Azure Data Studio
    # against the container), not something any other machine should reach. Publishing it on every
    # interface put the database on the LAN of whatever network the dev machine happened to be on.
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eticketing-network]
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eticketing-rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eticketing-network]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eticketing-redis
    # Loopback-only, same reasoning as sqlserver — and more urgent here: Redis runs with no
    # password and holds the sector capacity counters, so anyone who could reach this port could
    # take or wipe holds.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [eticketing-network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: ./backend
      dockerfile: services/identity/eTicketing.Identity.Api/Dockerfile
    container_name: eticketing-identity
    environment:
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
      Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS:-14}"
      RabbitMq__Host: "rabbitmq"
      # Organization logos live in Azure Blob Storage now (not proxied through this API), so
      # LogoUrl is a direct Azure URL — no Gateway-relative PublicBaseUrl needed here anymore.
      BlobStorage__ConnectionString: "${AZURE_STORAGE_CONNECTION_STRING:?Set AZURE_STORAGE_CONNECTION_STRING in .env}"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [eticketing-network]
    restart: unless-stopped

  catalog-service:
    build:
      context: ./backend
      dockerfile: services/catalog/eTicketing.Catalog.Api/Dockerfile
    container_name: eticketing-catalog
    environment:
      ConnectionStrings__CatalogDb: "Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      # Category icons live in Azure Blob Storage now (not proxied through this API), so IconUrl
      # is a direct Azure URL — no Gateway-relative PublicBaseUrl needed here anymore.
      BlobStorage__ConnectionString: "${AZURE_STORAGE_CONNECTION_STRING:?Set AZURE_STORAGE_CONNECTION_STRING in .env}"
      # Catalog publishes product.updated when a PUBLISHED product's vital fields change; Ticketing
      # consumes it and fans it out to that product's ticket holders.
      RabbitMq__Host: "rabbitmq"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [eticketing-network]
    restart: unless-stopped

  ticketing-service:
    build:
      context: ./backend
      dockerfile: services/ticketing/eTicketing.Ticketing.Api/Dockerfile
    container_name: eticketing-ticketing
    environment:
      ConnectionStrings__TicketingDb: "Server=sqlserver,1433;Database=TicketingDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      Services__Catalog: "http://catalog-service:8080"
      Services__Payment: "http://payment-service:8080"
      # No Services__Identity. Organization names and contact details come from the local
      # OrganizationSnapshot read model, fed by organization.changed over RabbitMQ — which is
      # what put this service back inside the documented two-call whitelist.
      RabbitMq__Host: "rabbitmq"
      # Signs the QR payload minted for every ticket, and verifies it back at the gate. Ticketing is
      # the ONLY service that needs this — PdfGeneration receives finished payloads on the event.
      Qr__SigningKey: "${QR_SIGNING_KEY:?Set QR_SIGNING_KEY in .env}"
      # GET /tickets/{id}/pdf renders the buyer's ticket here on demand — ticket PDFs are never
      # stored anywhere — so this service prints the same support footer as the e-mailed copy.
      TicketSupport__Email: "${SUPPORT_EMAIL:-podrska@ekarta.ba}"
      TicketSupport__Phone: "${SUPPORT_PHONE:-}"
      # AI Uvidi (GET /reports/insights). The ML.NET parts — forecast, anomalies,
      # segments — need no configuration at all; only the optional LLM summary on
      # top of them does, and it is off unless asked for.
      #
      # Groq's free tier is the recommended provider, and it is three values:
      #   INSIGHTS_NARRATIVE_PROVIDER=OpenAiCompatible
      #   INSIGHTS_NARRATIVE_BASE_URL=https://api.groq.com/openai/v1
      #   INSIGHTS_NARRATIVE_MODEL=llama-3.3-70b-versatile
      #   INSIGHTS_NARRATIVE_API_KEY=<free key>
      # It answers in a couple of seconds and writes markedly better Bosnian than a
      # 3B model can.
      #
      # Fully local, no key, nothing leaves the machine:
      #   docker compose --profile ai up -d
      #   docker exec eticketing-ollama ollama pull llama3.2:3b
      #   INSIGHTS_NARRATIVE_PROVIDER=OpenAiCompatible
      #   INSIGHTS_NARRATIVE_TIMEOUT_SECONDS=90
      # Be aware of what CPU inference costs: measured at ~3,8 tokens/s on a developer
      # laptop, a four-sentence summary is 40-70s of generation, and ollama needs a
      # further ~60s to load the model on its first request — during which our timeout
      # fires and ollama ABORTS the load, so it never becomes resident and every
      # request repeats it. Warm it once before relying on it:
      #   docker exec eticketing-ollama ollama run llama3.2:3b ""
      # and note OLLAMA_KEEP_ALIVE below, which stops it unloading again. On a GPU host,
      # or with a 1B model, none of this applies.
      Insights__Narrative__Provider: "${INSIGHTS_NARRATIVE_PROVIDER:-None}"
      Insights__Narrative__BaseUrl: "${INSIGHTS_NARRATIVE_BASE_URL:-http://ollama:11434/v1}"
      Insights__Narrative__Model: "${INSIGHTS_NARRATIVE_MODEL:-llama3.2:3b}"
      Insights__Narrative__ApiKey: "${INSIGHTS_NARRATIVE_API_KEY:-}"
      # Tune this to the model behind it. A local 3B model on CPU needs well over a minute for an
      # 8-10 sentence summary; a hosted model answers in a few seconds. Exceeding it costs the
      # summary and nothing else — the report still returns 200 with everything else intact.
      Insights__Narrative__TimeoutSeconds: "${INSIGHTS_NARRATIVE_TIMEOUT_SECONDS:-20}"
      # Token budget for the completion. 1400 because the summary itself now runs 8-10 sentences
      # (350-450 tokens of Bosnian) AND a reasoning model (Groq's gpt-oss-*, the qwen3 family)
      # spends this same budget on hidden reasoning BEFORE writing anything — measured at ~296
      # tokens here, on top of the answer. Too small a budget returns an empty completion with
      # HTTP 200 and no error. Drop it to ~350-400 only for a local CPU model, where generation
      # time is linear in tokens and a small local model does no hidden reasoning.
      Insights__Narrative__MaxTokens: "${INSIGHTS_NARRATIVE_MAX_TOKENS:-1400}"
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      catalog-service: { condition: service_started }
    networks: [eticketing-network]
    restart: unless-stopped

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment/eTicketing.Payment.Api/Dockerfile
    container_name: eticketing-payment
    environment:
      ConnectionStrings__PaymentDb: "Server=sqlserver,1433;Database=PaymentDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      # Renewals originate at Stripe and land here as webhooks, but the Ticket/Subscription rows live
      # in Ticketing — so this service publishes subscription.* events for it to consume.
      RabbitMq__Host: "rabbitmq"
      # "Mock" (default) or "Stripe". This is the whole rollback story for the payment integration:
      # docs/arhitektura-migracija-mikroservisi-eda.md section 9 names Stripe the second thing to
      # sacrifice, with an explicit fallback to the internal mock. Flipping this back to Mock and
      # restarting this one container returns the entire stack to the pre-Stripe behaviour — the
      # provider name travels to the clients on every payment-intent response, so web and mobile
      # switch to the legacy card form on their own, with NO rebuild.
      Payment__Provider: "${PAYMENT_PROVIDER:-Mock}"
      # Note ":-" and not ":?" — the stack must still boot with no Stripe credentials at all, which
      # is what keeps the Mock fallback genuinely usable.
      Payment__Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      # Safe to hand to a browser by definition; returned to the clients rather than baked into their
      # builds, so rotating it is an .env edit plus a restart.
      Payment__Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY:-}"
      # From `stripe listen` when testing locally, NOT the value shown in the Stripe dashboard.
      Payment__Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      # Prices display as KM everywhere, but a Stripe test account can only present the currencies
      # its country allows and BAM is unavailable on most of them. See docs/payment-setup-guide.md.
      Payment__Stripe__Currency: "${STRIPE_CURRENCY:-eur}"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [eticketing-network]
    restart: unless-stopped
    # Still intentionally no "ports:" — this service is internal, called by ticketing-service. The
    # one exception is the Stripe webhook, which reaches it through the Gateway on an exact-path
    # route (/api/payments/webhook); nothing else on this service is publicly routable.

  notifications-service:
    build:
      context: ./backend
      dockerfile: services/notifications/eTicketing.Notifications/Dockerfile
    container_name: eticketing-notifications
    environment:
      RabbitMq__Host: "rabbitmq"
      Brevo__ApiKey: "${BREVO_API_KEY:?Set BREVO_API_KEY in .env}"
      Brevo__SenderEmail: "${BREVO_SENDER_EMAIL:?Set BREVO_SENDER_EMAIL in .env}"
      Brevo__SenderName: "${BREVO_SENDER_NAME:-eKarta}"
      Frontend__WebBaseUrl: "${CORS_ALLOWED_ORIGIN:-http://localhost:4200}"
      # Remembers which events already produced their email, so a redelivered one is not sent twice.
      # See DeduplicatingDeliveryHandler.
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [eticketing-network]
    restart: unless-stopped

  pdfgeneration-service:
    build:
      context: ./backend
      dockerfile: services/pdfgeneration/eTicketing.PdfGeneration/Dockerfile
    container_name: eticketing-pdfgeneration
    environment:
      RabbitMq__Host: "rabbitmq"
      # Printed in the footer of every ticket. The phone is optional — left unset, the ticket shows
      # the address alone rather than a number nobody answers.
      TicketSupport__Email: "${SUPPORT_EMAIL:-podrska@ekarta.ba}"
      TicketSupport__Phone: "${SUPPORT_PHONE:-}"
      # No Services__Catalog and no catalog-service dependency: TicketPurchased now carries the
      # product's name, date and city, read from Ticketing's own ProductSnapshot at purchase time.
      # This consumer talks to the broker and to blob storage, and to nothing else.
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [eticketing-network]
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/eTicketing.Gateway/Dockerfile
    container_name: eticketing-gateway
    environment:
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN:-http://localhost:4200}"
      Cors__AllowedOrigins__1: "http://localhost:${WEB_PORT:-4200}"
      ReverseProxy__Clusters__identity-cluster__Destinations__d1__Address: "http://identity-service:8080/"
      ReverseProxy__Clusters__catalog-cluster__Destinations__d1__Address: "http://catalog-service:8080/"
      ReverseProxy__Clusters__ticketing-cluster__Destinations__d1__Address: "http://ticketing-service:8080/"
      # Only the Stripe webhook is routed to this cluster (exact path /api/payments/webhook) --
      # payment-service has no other public route. See the gateway's appsettings.json.
      ReverseProxy__Clusters__payment-cluster__Destinations__d1__Address: "http://payment-service:8080/"
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      - identity-service
      - catalog-service
      - ticketing-service
      - payment-service
    networks: [eticketing-network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Web (Angular SSR — built and served entirely inside Docker)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend/web
      args:
        # The root .env is not part of the web build context, so @ngx-env/builder cannot read it
        # from inside the image — this ARG is how the value reaches the build there. (It merges
        # process.env with whatever .env it finds, so both paths work unchanged.)
        NG_APP_GOOGLE_MAPS_API_KEY: "${NG_APP_GOOGLE_MAPS_API_KEY:-}"
    container_name: eticketing-web
    environment:
      PORT: "4000"
      # The browser talks only to this container; server.ts proxies /api on to the Gateway over the
      # internal network. Runtime, not a build arg — that is the whole point of the name not
      # starting with NG_APP_, which the builder would have frozen into the bundle at build time.
      GATEWAY_INTERNAL_URL: "http://gateway:8080"
    ports:
      - "${WEB_PORT:-4200}:4000"
    depends_on:
      - gateway
    networks: [eticketing-network]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mobile (Flutter Android APK) — one-shot builder, not a running service.
  # Run explicitly: docker compose --profile build run --rm mobile-build
  # ---------------------------------------------------------------------------
  mobile-build:
    build:
      context: ./frontend/mobile
      args:
        MOBILE_API_BASE_URL: "${MOBILE_API_BASE_URL:-http://10.0.2.2:5000/api/}"
        MOBILE_BUILD_MODE: "${MOBILE_BUILD_MODE:-release}"
    container_name: eticketing-mobile-build
    volumes:
      - ./dist/mobile:/out
    profiles: ["build"]

  # ---------------------------------------------------------------------------
  # Desktop (Flutter Linux bundle) — one-shot builder, not a running service.
  # Run explicitly: docker compose --profile build run --rm desktop-build
  # ---------------------------------------------------------------------------
  desktop-build:
    build:
      context: ./frontend/desktop
      args:
        DESKTOP_API_BASE_URL: "${DESKTOP_API_BASE_URL:-http://localhost:5000/api/}"
        DESKTOP_BUILD_MODE: "${DESKTOP_BUILD_MODE:-release}"
    container_name: eticketing-desktop-build
    volumes:
      - ./dist/desktop:/out
    profiles: ["build"]

  # Optional local LLM for the AI Uvidi summary. Behind a profile, following the
  # same convention as the mobile-build/desktop-build one-shots: the image plus a
  # model is a multi-GB pull, and a plain `docker compose up -d --build` must not
  # drag it in for a feature that is off by default.
  #
  # Deliberately not in ticketing-service's depends_on. The narrative is optional
  # by design — a missing or dead model server returns no summary and changes
  # nothing else — so making the ticketing service wait on it would hand an
  # optional flourish a veto over the whole report.
  ollama:
    image: ollama/ollama:latest
    container_name: eticketing-ollama
    profiles: ["ai"]
    environment:
      # Never unload. The default is a 5-minute idle eviction, which on CPU means the
      # next report pays the ~60s model load again — and because that load is longer
      # than any sane request timeout, the client disconnects and ollama aborts it, so
      # the model never becomes resident at all. Keeping it pinned is what makes the
      # local option usable rather than merely configured.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    networks: [eticketing-network]
    restart: unless-stopped

networks:
  eticketing-network:

volumes:
  sqlserver-data:
  ollama-models:
