name: Deploy web

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/web/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: az acr build -r eticketingacr -t web:${{ github.sha }} --build-arg NG_APP_API_BASE_URL=https://gateway.thankfulplant-ceb4a7f8.westeurope.azurecontainerapps.io/api --build-arg NG_APP_GOOGLE_MAPS_API_KEY=${{ secrets.NG_APP_GOOGLE_MAPS_API_KEY }} frontend/web

      - name: Deploy to Container App
        run: az containerapp update -n web -g eticketing-dev --image eticketingacr.azurecr.io/web:${{ github.sha }}