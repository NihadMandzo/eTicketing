name: Deploy web

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/web/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.IDENTITYSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IDENTITYSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IDENTITYSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          echo "server=$(az acr show -n eticketingacr --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          az acr build \
            -r eticketingacr \
            -t web:${{ github.sha }} \
            --build-arg NG_APP_GOOGLE_MAPS_API_KEY="${{ secrets.NG_APP_GOOGLE_MAPS_API_KEY }}" \
            frontend/web

      - name: Deploy to Container App
        run: |
          az containerapp update \
            -n web \
            -g eticketing-dev \
            --image ${{ steps.acr.outputs.server }}/web:${{ github.sha }} 