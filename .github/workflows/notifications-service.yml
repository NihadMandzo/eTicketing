name: Deploy notifications-service

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/services/notifications/**'
      - 'backend/shared/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Best practice, not optional: without this, two quick pushes race to update the
# same Container App and whichever `az containerapp update` lands second wins —
# which might be the older commit. One in-flight deploy per app, always.
concurrency:
  group: deploy-notifications-service
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.IDENTITYSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IDENTITYSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IDENTITYSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: echo "server=$(az acr show -n eticketingacr --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: az acr build -r eticketingacr -t notifications:${{ github.sha }} -f backend/services/notifications/eTicketing.Notifications.Api/Dockerfile backend

      - name: Deploy to Container App
        run: az containerapp update -n notifications-service -g eticketing-dev --image ${{ steps.acr.outputs.server }}/notifications:${{ github.sha }}
