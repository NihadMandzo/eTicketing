name: Deploy identity-service

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/services/identity/**'
      - 'backend/shared/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Best practice, not optional: without this, two quick pushes race to update the
# same Container App and whichever `az containerapp update` lands second wins —
# which might be the older commit. One in-flight deploy per app, always.
concurrency:
  group: deploy-identity-service
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.IDENTITYSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IDENTITYSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IDENTITYSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: echo "server=$(az acr show -n eticketingacr --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: az acr build -r eticketingacr -t identity:${{ github.sha }} -f backend/services/identity/eTicketing.Identity.Api/Dockerfile backend

      - name: Deploy to Container App
        run: |
          # ForwardedHeaders__ForwardLimit is the trust boundary for the per-IP login/email rate
          # limiter, and it has to be set here because it differs per deployment: local compose is
          # one hop and uses the code's default of 1. Production is sized to its *shortest* chain,
          # the Flutter clients' two (ingress -> Gateway -> identity), not the web tier's three.
          # A higher value lets a caller on the shorter path prepend a forged X-Forwarded-For entry
          # and be believed; the cost of 2 is that browser users are bucketed by an internal proxy
          # address and share one limit between them. See ForwardedHeadersExtensions.
          az containerapp update \
            -n identity-service \
            -g eticketing-dev \
            --image ${{ steps.acr.outputs.server }}/identity:${{ github.sha }} \
            --set-env-vars ForwardedHeaders__ForwardLimit=2
